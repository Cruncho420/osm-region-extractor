name: Scripts Tests

# Purpose: run the scripts/ unit tests on every change to them.
#
# WHY THIS EXISTS: scripts/merge-valhalla-fields.mjs is the only thing standing
# between a rollout and a damaged production manifest.json — the file EVERY app
# install reads to download road data. Its guard refuses any merge that is not
# strictly additive (same version, same region set, every pre-existing field
# byte-identical). A guard that only runs when someone remembers to run it is not
# a guard, and until this workflow existed nothing in CI ran `npm test` at all.
#
# node --test, no test-runner dependency: the whole point of these scripts is to
# be runnable from a bare runner with `npm install` and nothing exotic.

on:
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/scripts-tests.yml'
      # chain-workflow-name.test.mjs asserts across workflow files: that the
      # monthly chain still listens for osm-extract.yml's exact `name:`, and that
      # valhalla-tiles.yml is still dispatch-only. Those tests are worthless if
      # they only run when scripts/ changes — the edit that breaks them is an
      # edit to one of these three files, and its whole failure mode is silence.
      - '.github/workflows/osm-extract.yml'
      - '.github/workflows/notify-osm-failure.yml'
      - '.github/workflows/test-osm-notification.yml'
      - '.github/workflows/valhalla-tiles.yml'
      - '.github/workflows/chain-valhalla-after-extract.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/scripts-tests.yml'
      # Same cross-workflow reason as above.
      - '.github/workflows/osm-extract.yml'
      - '.github/workflows/notify-osm-failure.yml'
      - '.github/workflows/test-osm-notification.yml'
      - '.github/workflows/valhalla-tiles.yml'
      - '.github/workflows/chain-valhalla-after-extract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # `npm ci`, because scripts/package-lock.json IS committed (it landed in
      # addb840 as a side effect of an install and is worth keeping: this repo
      # publishes the data a shipped app downloads, so a reproducible dependency
      # tree is the point, not a nicety). `npm ci` additionally FAILS when the
      # lockfile and package.json disagree, which is exactly the drift you want
      # a test workflow to catch. The older workflows still use `npm install`;
      # they now resolve against the same lockfile either way.
      - name: Install dependencies
        working-directory: scripts
        run: npm ci

      - name: Install osmium-tool for downloader contract tests
        run: sudo apt-get update && sudo apt-get install -y osmium-tool

      - name: Run tests
        working-directory: scripts
        run: npm test

      # The merge script is what edits production manifest.json, so a syntax
      # error in it must fail here rather than mid-rollout. `--check` parses
      # without executing; the file guards its CLI behind an import.meta check,
      # but not executing at all is stronger than relying on that guard.
      - name: Syntax-check the merge script
        working-directory: scripts
        run: node --check merge-valhalla-fields.mjs
