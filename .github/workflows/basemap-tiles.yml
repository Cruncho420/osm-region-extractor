name: Basemap PMTiles

# Purpose: build one offline MAP file per region for the Rods app (FEAT-090 ME-13, Mapbox exit).
# Each region ships as ONE PMTiles archive the app downloads next to its road data and
# routing pack, copies to app storage and opens with MapLibre as pmtiles://file://….
#
# Recipe: `pmtiles extract` cuts the region out of the Protomaps daily planet build
# (https://build.protomaps.com/<YYYYMMDD>.pmtiles, basemap schema v4 — the schema the
# app's map style is written against) using HTTP RANGE requests. Nothing near the
# 120 GB planet is downloaded: Latvia z0-14 = 161 requests, 163 MB transferred for a
# 156 MB archive (measured 2026-09-23). The clip polygon is the region's Geofabrik
# .poly — the exact boundary its road data and routing pack were cut with, so the map
# covers what the data covers.
#
# Publishing mirrors valhalla-tiles.yml (read its comments; the reasons are the same):
# - dispatch-only; every job is gated on workflow_dispatch.
# - a SEPARATE release per data version, always a PRERELEASE, with its OWN manifest.json.
#   The monthly osm-* manifest is never touched, so no already-shipped app binary can
#   ever be offered a map file, and rollback is deleting a prerelease.
#   `basemap-smoke-<n>`  throwaway proof, version = today, assets may be replaced.
#   `basemap-<YYYY-MM-DD>` production, version = the date in the tag, which MUST equal
#                        the monthly manifest's version (the app builds the URL from it).
#                        Assets are IMMUTABLE: an existing asset is never replaced, so a
#                        URL + checksum the app pinned can never change under it.
# - the manifest carries basemapSize + full sha256 + maxZoom + planet date per region.
#
# SPLIT COUNTRIES (FEAT-090 L4, Tadas 2026-09-24): a region whose road + routing + map download
# is over 2 GB ships as PIECES along natural sub-regions (scripts/region-slices.json — the same
# piece ids and outlines as the routing slices). Such a country gets one map file per piece
# (`<piece-id>-basemap.pmtiles`) and NO whole-country file; every other region stays whole.
# scripts/basemap-units.mjs is the list of "units" (regions + pieces) a release must carry; the
# per-unit work is scripts/basemap-build-unit.sh. A piece never drops a zoom to fit (it fails
# instead — split it further); a piece may declare its own mapMaxZoom (Nunavut: 12, decided).
#
# Max zoom is an INPUT: 14 by default ("Normal", owner decision D8; the app overzooms to 17).
# Files must stay under 2 GiB: GitHub's per-asset cap, and the app's background downloader
# carries the size as a 32-bit int. A region over the cap is rebuilt one zoom lower
# (never below 12) and the manifest records the zoom it really has (basemapMaxZoom); the
# run summary lists every such region, because it is a deviation from D8.
#
# PRODUCTION RELEASE GATE (basemap-<YYYY-MM-DD>) — the 2026-07-29 / 2026-08-01 lessons:
# the app treats a basemap release as live the moment `manifest.json` exists on it. So a
# production run NEVER writes manifest.json until every region in scripts/regions.json is
# on the release with the exact size + sha256 in the manifest. Until then it accumulates
# into `manifest-staging.json`, which no app reads. A failed region leaves no asset behind
# (it is deleted if its served bytes do not verify), and a re-run with regions=all builds
# only the regions the staging manifest does not have yet — so recovery is "run it again".
#
# R2 (FEAT-090 ME-13b): when the bucket-scoped secrets R2_ACCOUNT_ID, R2_MAPS_ACCESS_KEY_ID
# and R2_MAPS_SECRET_ACCESS_KEY exist, every production file is also uploaded to bucket
# rods-maps at releases/<version>/<region>/<file> (immutable, read back + re-hashed), and
# the root pointer manifest.json gets this release's basemap entries LAST, only after the
# GitHub manifest is complete. Without the secrets those steps skip. Never give this public
# repo an account-wide key: the account also holds the website buckets.

on:
  workflow_dispatch:
    inputs:
      regions:
        description: 'Comma list of regions (region id, id suffix, or geofabrik path fragment), or "all"'
        required: true
        default: 'lithuania,latvia'
        type: string
      maxzoom:
        description: 'Maximum zoom baked into the file (14 default; 15 ≈ 2x size)'
        required: false
        default: '14'
        type: choice
        options: ['12', '13', '14', '15']
      planet:
        description: 'Protomaps planet build date YYYYMMDD. Empty = newest available in the last 7 days'
        required: false
        default: ''
        type: string
      upload:
        description: 'Publish to the release (false = build + measure only)'
        required: false
        default: true
        type: boolean
      tag:
        description: 'basemap-smoke-<n> or basemap-<YYYY-MM-DD>. Empty = basemap-smoke-<run_number>'
        required: false
        default: ''
        type: string
      rebuild_pieces:
        description: 'Production only: rebuild the split countries PIECES in place after an outline change (their manifest entries may change; nothing else may)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  PMTILES_VERSION: '1.31.2'
  PMTILES_SHA256: '3ed7dbf4ec2e6dfe5e25b6f70d1ffc932729f93c86db353bf514dd71010a312f'
  MAX_ASSET_BYTES: '2147483647'

jobs:
  get-regions:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      count: ${{ steps.resolve.outputs.count }}
      planet: ${{ steps.planet.outputs.planet }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve region tokens to region ids
        id: resolve
        env:
          REGIONS_INPUT: ${{ inputs.regions }}
          TAG_INPUT: ${{ inputs.tag }}
          REBUILD_PIECES: ${{ inputs.rebuild_pieces }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          R2_ON: ${{ secrets.R2_ACCOUNT_ID != '' && secrets.R2_MAPS_ACCESS_KEY_ID != '' && secrets.R2_MAPS_SECRET_ACCESS_KEY != '' }}
        run: |
          set -euo pipefail
          IDS=""
          # Units = regions.json with every split country replaced by its pieces.
          node scripts/basemap-units.mjs scripts/regions.json scripts/region-slices.json > units.json
          [ "$(echo "$REGIONS_INPUT" | tr -d '[:space:]')" = all ] && REGIONS_INPUT=$(jq -r '[.[].id] | join(",")' units.json)
          IFS=',' read -ra TOKENS <<< "$REGIONS_INPUT"
          for tok in "${TOKENS[@]}"; do
            tok="$(echo "$tok" | tr -d '[:space:]')"
            [ -z "$tok" ] && continue
            # A split country's id selects all of its pieces; otherwise one unit must match.
            MATCHES=$(jq -r --arg t "$tok" '[.[] | select(.country == $t)] | .[].id' units.json)
            if [ -z "$MATCHES" ]; then
              MATCHES=$(jq -r --arg t "$tok" '
                [.[] | select(.id == $t)] as $exact
                | (if ($exact | length) > 0 then $exact
                   else [.[] | select((.id | endswith($t)) or (.poly | contains($t)))]
                   end)
                | [.[].id] | unique | .[]' units.json)
              N=$(printf '%s' "$MATCHES" | grep -c . || true)
              [ "$N" -eq 1 ] || { echo "::error::Region token '$tok' matches $N units: $(echo $MATCHES)"; exit 1; }
            fi
            IDS="${IDS}${MATCHES}"$'\n'
          done
          [ -n "$IDS" ] || { echo "::error::No regions provided"; exit 1; }
          printf '%s' "$IDS" | grep . | sort -u > wanted.txt
          # Production resume: a region already in the staging manifest (and on R2 when R2 is
          # configured) is done. Re-running the same tag builds only what is missing.
          : > done.txt
          case "$TAG_INPUT" in basemap-[0-9]*)
            if gh release download "$TAG_INPUT" -R "$REPO" -D prev --pattern manifest-staging.json 2>/dev/null; then
              if [ "$R2_ON" = true ]; then
                jq -r '.regions | to_entries[] | select(.value.r2Key) | .key' prev/manifest-staging.json | sort -u > done.txt
              else
                jq -r '.regions | keys[]' prev/manifest-staging.json | sort -u > done.txt
              fi
            fi ;;
          esac
          # rebuild_pieces: the pieces' outlines changed (scripts/polys), so they are never "done".
          if [ "$REBUILD_PIECES" = true ]; then
            node scripts/basemap-units.mjs scripts/regions.json scripts/region-slices.json | jq -r '.[] | select(.country) | .id' | sort -u > pieces.txt
            comm -23 done.txt pieces.txt > done.tmp && mv done.tmp done.txt
          fi
          comm -23 wanted.txt done.txt > todo.txt
          COUNT=$(grep -c . todo.txt || true)
          # GitHub caps a matrix at 256 jobs and there are 258 units: batch them, at most 200 jobs.
          # A batch is the units' JSON, built one after another on the same runner.
          PER=$(( (COUNT + 199) / 200 )); [ "$PER" -ge 1 ] || PER=1
          MATRIX=$(jq -R . todo.txt | jq -sc --slurpfile u units.json --argjson per "$PER" '
            [ . as $ids | range(0; length; $per) as $i | $ids[$i:$i+$per]
              | map(. as $id | $u[0][] | select(.id == $id)) | tojson ]')
          { echo "matrix=$MATRIX"; echo "count=$COUNT"; } >> "$GITHUB_OUTPUT"
          echo "Resolved $(grep -c . wanted.txt) units, $(grep -c . done.txt || true) already done, building $COUNT in batches of $PER"
      - name: Resolve the planet build ONCE (every region of a run must share it)
        id: planet
        env:
          PLANET_INPUT: ${{ inputs.planet }}
        run: |
          set -euo pipefail
          if [ -n "$PLANET_INPUT" ]; then
            CANDIDATES="$PLANET_INPUT"
          else
            CANDIDATES=$(for d in 0 1 2 3 4 5 6 7; do date -u -d "-$d day" +%Y%m%d; done)
          fi
          for d in $CANDIDATES; do
            if curl -sfI "https://build.protomaps.com/$d.pmtiles" > /dev/null; then
              echo "planet=$d" >> "$GITHUB_OUTPUT"; echo "Planet build: $d"; exit 0
            fi
          done
          echo "::error::No Protomaps planet build found for: $CANDIDATES"; exit 1

  prepare-release:
    needs: get-regions
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.info.outputs.tag_name }}
      version: ${{ steps.info.outputs.version }}
      channel: ${{ steps.info.outputs.channel }}
    steps:
      - name: Resolve tag + version
        id: info
        run: |
          set -euo pipefail
          TAG_INPUT="${{ inputs.tag }}"
          case "$TAG_INPUT" in
            '') TAG="basemap-smoke-${{ github.run_number }}"; VERSION=$(date -u +%Y-%m-%d); CHANNEL=smoke ;;
            basemap-smoke-*) TAG="$TAG_INPUT"; VERSION=$(date -u +%Y-%m-%d); CHANNEL=smoke ;;
            basemap-[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) TAG="$TAG_INPUT"; VERSION="${TAG_INPUT#basemap-}"; CHANNEL=production ;;
            *) echo "::error::tag '$TAG_INPUT' must be basemap-smoke-<n> or basemap-<YYYY-MM-DD>"; exit 1 ;;
          esac
          { echo "tag_name=$TAG"; echo "version=$VERSION"; echo "channel=$CHANNEL"; } >> "$GITHUB_OUTPUT"
          echo "Channel: $CHANNEL  Tag: $TAG  version: $VERSION"
      - name: Create the release if it does not exist
        if: inputs.upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${{ steps.info.outputs.tag_name }}"
          gh release view "$TAG" -R "$REPO" > /dev/null 2>&1 && { echo "Release $TAG exists — appending."; exit 0; }
          # A concurrent batch may win the create race; that is fine if the release now exists.
          gh release create "$TAG" -R "$REPO" --prerelease --target "${{ github.sha }}" \
            --title "Basemap PMTiles (${{ steps.info.outputs.channel }}) - ${{ steps.info.outputs.version }}" \
            --notes "Offline map files for the Rods app (FEAT-090 ME-13). One {region-id}-basemap.pmtiles per region (Protomaps basemap v4, cut from the planet build named in manifest.json), and manifest.json with basemapSize / basemapChecksum (full sha256) / basemapMaxZoom / basemapPlanet per region. PRERELEASE on purpose: it must never become releases/latest." \
            || gh release view "$TAG" -R "$REPO" > /dev/null

  build:
    needs: [get-regions, prepare-release]
    if: github.event_name == 'workflow_dispatch' && needs.get-regions.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # 12 concurrent range-readers against build.protomaps.com (be a polite client of a
      # free service); 234 regions take about an hour.
      max-parallel: 12
      matrix:
        batch: ${{ fromJson(needs.get-regions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pmtiles (pinned + checksummed)
        run: |
          set -euo pipefail
          F="go-pmtiles_${PMTILES_VERSION}_Linux_x86_64.tar.gz"
          curl -sfLO "https://github.com/protomaps/go-pmtiles/releases/download/v${PMTILES_VERSION}/$F"
          echo "${PMTILES_SHA256}  $F" | sha256sum -c -
          tar xzf "$F" pmtiles && sudo mv pmtiles /usr/local/bin/ && pmtiles version
      - name: Build, verify and publish every unit of this batch
        env:
          BATCH: ${{ matrix.batch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare-release.outputs.tag_name }}
          CHANNEL: ${{ needs.prepare-release.outputs.channel }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
          PLANET: ${{ needs.get-regions.outputs.planet }}
          MAXZOOM: ${{ inputs.maxzoom }}
          UPLOAD: ${{ inputs.upload }}
          REBUILD_PIECES: ${{ inputs.rebuild_pieces }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_MAPS_ACCESS_KEY_ID: ${{ secrets.R2_MAPS_ACCESS_KEY_ID }}
          R2_MAPS_SECRET_ACCESS_KEY: ${{ secrets.R2_MAPS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          jq -c '.[]' <<< "$BATCH" | while read -r UNIT; do bash scripts/basemap-build-unit.sh "$UNIT"; done
          echo "NAME=$(jq -r '.[0].id' <<< "$BATCH")" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: basemap-report-${{ env.NAME }}
          path: report/*.json

  finalize:
    needs: [get-regions, prepare-release, build]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && inputs.upload && needs.prepare-release.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: basemap-report-*
          path: reports
          merge-multiple: true
      - name: Accumulate the manifest; production publishes manifest.json only when COMPLETE
        id: manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare-release.outputs.tag_name }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
          CHANNEL: ${{ needs.prepare-release.outputs.channel }}
          REBUILD_PIECES: ${{ inputs.rebuild_pieces }}
          R2_ON: ${{ secrets.R2_ACCOUNT_ID != '' && secrets.R2_MAPS_ACCESS_KEY_ID != '' && secrets.R2_MAPS_SECRET_ACCESS_KEY != '' }}
        run: |
          set -euo pipefail
          mkdir -p reports prev
          ACC=manifest.json; [ "$CHANNEL" = production ] && ACC=manifest-staging.json
          jq -s --arg v "$VERSION" --arg g "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version:$v, generatedAt:$g, schema:"protomaps-basemap-v4",
              regions:(map({(.region): (del(.region, .requests, .seconds))}) | add // {})}' reports/*.json 2>/dev/null > work.json \
            || jq -n --arg v "$VERSION" '{version:$v, schema:"protomaps-basemap-v4", regions:{}}' > work.json
          if gh release download "$TAG" -R "$REPO" -D prev --pattern "$ACC" 2>/dev/null; then
            PREV=$(jq -r '.version' "prev/$ACC")
            [ "$PREV" = "$VERSION" ] || { echo "::error::$TAG carries version $PREV, this run is $VERSION"; exit 1; }
            jq -s '(.[0].regions * .[1].regions) as $m | .[1] | .regions = $m' "prev/$ACC" work.json > "$ACC"
          else
            cp work.json "$ACC"
          fi
          [ "$(jq '.regions | length' "$ACC")" -gt 0 ] || { echo "::error::No region produced a report"; exit 1; }
          gh release upload "$TAG" -R "$REPO" "$ACC" --clobber
          [ "$CHANNEL" = production ] || exit 0

          # ── superseded whole-country files (FEAT-090 L4): a country now shipped as pieces may still
          #    have its whole file from before the split in the staging manifest. No app ever pinned
          #    it (manifest.json is only written once complete), so before publication it is dropped
          #    from staging and its asset deleted. After publication production is immutable.
          node scripts/basemap-units.mjs scripts/regions.json scripts/region-slices.json > units.json
          jq -r '[.[].country // empty] | unique | .[]' units.json > split.txt
          gh release view "$TAG" -R "$REPO" --json assets -q '.assets[].name' > names.txt
          if ! grep -qx manifest.json names.txt; then
            for C in $(jq -r '.regions | keys[]' "$ACC" | grep -xF -f split.txt || true); do
              echo "::notice::$C is shipped as pieces now; dropping its whole-country map file from $TAG"
              jq --arg c "$C" 'del(.regions[$c])' "$ACC" > acc.tmp && mv acc.tmp "$ACC"
              gh release delete-asset "$TAG" "$C-basemap.pmtiles" -R "$REPO" -y 2>/dev/null || true
            done
            gh release upload "$TAG" -R "$REPO" "$ACC" --clobber
          fi

          # ── completeness gate: every unit (whole region or piece), on the release, exact size,
          #    and on R2 if R2 is on
          jq -r '.[].id' units.json | sort -u > expected.txt
          jq -r '.regions | keys[]' "$ACC" | sort -u > staged.txt
          gh release view "$TAG" -R "$REPO" --json assets \
            -q '.assets[] | select(.name | endswith("-basemap.pmtiles")) | "\(.name | sub("-basemap.pmtiles$"; "")) \(.size)"' | sort -u > assets.txt
          jq -r '.regions | to_entries[] | "\(.key) \(.value.basemapSize)"' "$ACC" | sort -u > pinned.txt
          MISSING=$(comm -23 expected.txt staged.txt | paste -sd' ')
          EXTRA=$(comm -13 expected.txt staged.txt | paste -sd' ')
          BADSIZE=$(comm -23 pinned.txt assets.txt | cut -d' ' -f1 | paste -sd' ')
          NOR2=""; [ "$R2_ON" = true ] && NOR2=$(jq -r '.regions | to_entries[] | select(.value.r2Key | not) | .key' "$ACC" | paste -sd' ')
          if [ -n "$MISSING$EXTRA$BADSIZE$NOR2" ]; then
            echo "::error::INCOMPLETE — manifest.json NOT published. missing: [$MISSING] unknown: [$EXTRA] size mismatch: [$BADSIZE] not on R2: [$NOR2]. Re-run with regions=all."
            exit 1
          fi
          # The app-facing manifest: exactly the fields the app reads, plus provenance. A piece also
          # names its country (pieceOf); the app keeps its own piece catalogue and does not need it.
          jq '{version, generatedAt, schema, regions: (.regions | map_values({basemapSize, basemapChecksum, basemapMaxZoom, basemapPlanet} + (if .pieceOf then {pieceOf} else {} end)))}' \
            "$ACC" > manifest.json
          if gh release download "$TAG" -R "$REPO" -D live --pattern manifest.json 2>/dev/null; then
            if [ "$REBUILD_PIECES" = true ]; then
              # Outline change: ONLY piece entries may differ, and the set of units may not.
              PIECES=$(jq -c '[.[] | select(.country) | .id]' units.json)
              strip() { jq -S --argjson p "$PIECES" '.regions | with_entries(select(.key as $k | $p | index($k) | not))' "$1"; }
              cmp -s <(strip live/manifest.json) <(strip manifest.json) || { echo "::error::rebuild_pieces changed a non-piece entry"; exit 1; }
              cmp -s <(jq -S '.regions | keys' live/manifest.json) <(jq -S '.regions | keys' manifest.json) || { echo "::error::rebuild_pieces changed the unit set"; exit 1; }
              gh release upload "$TAG" -R "$REPO" manifest.json --clobber
              echo "manifest.json republished: piece entries only"
            else
              cmp -s <(jq -S .regions live/manifest.json) <(jq -S .regions manifest.json) \
                || { echo "::error::$TAG already has a DIFFERENT manifest.json — production manifests are immutable"; exit 1; }
              echo "manifest.json already published and identical"
            fi
          else
            gh release upload "$TAG" -R "$REPO" manifest.json
          fi
          echo "complete=true" >> "$GITHUB_OUTPUT"
          echo "COMPLETE: $(wc -l < expected.txt | tr -d ' ') units ($(jq '[.[] | select(.country)] | length' units.json) pieces of $(wc -l < split.txt | tr -d ' ') split countries), $(jq '[.regions[].basemapSize] | add' manifest.json) bytes"
      - name: Point R2 at this release (last, only after the GitHub manifest is complete)
        if: steps.manifest.outputs.complete == 'true'
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_MAPS_ACCESS_KEY_ID: ${{ secrets.R2_MAPS_ACCESS_KEY_ID }}
          R2_MAPS_SECRET_ACCESS_KEY: ${{ secrets.R2_MAPS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          { [ -n "$R2_ACCOUNT_ID" ] && [ -n "$R2_MAPS_ACCESS_KEY_ID" ] && [ -n "$R2_MAPS_SECRET_ACCESS_KEY" ]; } \
            || { echo "R2 secrets not configured — pointer untouched"; exit 0; }
          jq '.regions | map_values({key: .r2Key, size: .basemapSize, sha256: .basemapChecksum, github, maxZoom: .basemapMaxZoom, planet: .basemapPlanet})' \
            manifest-staging.json > entries.json
          python3 scripts/r2.py merge-pointer "$VERSION" basemap entries.json
      - name: Summary
        if: always()
        run: |
          [ -f manifest-staging.json ] && M=manifest-staging.json || M=manifest.json
          [ -f "$M" ] || exit 0
          {
            echo "## Basemap PMTiles — ${{ needs.prepare-release.outputs.tag_name }}"
            echo ""
            echo "Regions: $(jq '.regions | length' "$M"), total $(jq '[.regions[].basemapSize] | add / 1073741824 * 100 | floor / 100' "$M") GiB"
            echo ""
            echo "**Below the requested zoom (over 2 GiB at z${{ inputs.maxzoom }}):** $(jq -r --argjson z ${{ inputs.maxzoom }} '[.regions | to_entries[] | select(.value.basemapMaxZoom < $z) | "\(.key) z\(.value.basemapMaxZoom)"] | join(", ") | if . == "" then "none" else . end' "$M")"
            echo ""
            echo "**Pieces of split countries:** $(jq '[.regions[] | select(.pieceOf)] | length' "$M")"
            echo ""
            echo "| Region | Size (MB) | Max zoom | Tiles | sha256 | R2 |"
            echo "|---|---:|---:|---:|---|---|"
            jq -r '.regions | to_entries | sort_by(-.value.basemapSize)[] | "| \(.key) | \((.value.basemapSize/1048576*10|floor)/10) | \(.value.basemapMaxZoom) | \(.value.tiles // "") | `\(.value.basemapChecksum[0:16])` | \(if .value.r2Key then "yes" else "" end) |"' "$M"
          } >> "$GITHUB_STEP_SUMMARY"
