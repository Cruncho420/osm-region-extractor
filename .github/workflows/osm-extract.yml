name: Monthly OSM Data Extraction

# Purpose: Extract traffic calming and roundabout data from OpenStreetMap monthly
# Goal: Provide pre-downloaded regional OSM data to avoid Overpass API calls
#
# This workflow:
# 1. Runs on the 1st of every month at 3 AM UTC (or manually)
# 2. Extracts ~100 regions in parallel (max 20 concurrent)
# 3. Creates a GitHub Release with all extracted files
# 4. Cleans up old releases (keeps last 3)

on:
  schedule:
    - cron: '0 3 1 * *'  # 1st of every month at 3 AM UTC
  workflow_dispatch:      # Manual trigger for testing
    inputs:
      single_region:
        description: 'Extract single region (leave empty for all)'
        required: false
        type: string

permissions:
  contents: write  # Required for creating releases

jobs:
  # Job 1: Get list of all regions to extract
  get-regions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.regions.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Get regions list
        id: regions
        run: |
          if [ -n "${{ inputs.single_region }}" ]; then
            # Single region extraction
            echo "matrix=[\"${{ inputs.single_region }}\"]" >> $GITHUB_OUTPUT
          else
            # All regions
            echo "matrix=$(jq -c '[.regions[].id]' scripts/regions.json)" >> $GITHUB_OUTPUT
          fi

      - name: Show regions to extract
        run: |
          echo "Regions to extract:"
          echo '${{ steps.regions.outputs.matrix }}' | jq -r '.[]'
          echo "Total: $(echo '${{ steps.regions.outputs.matrix }}' | jq 'length')"

  # Job 2: Extract each region in parallel
  extract:
    needs: get-regions
    runs-on: ubuntu-latest
    strategy:
      matrix:
        region: ${{ fromJson(needs.get-regions.outputs.matrix) }}
      max-parallel: 20
      fail-fast: false  # Continue even if some regions fail
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install osmium-tool
        run: sudo apt-get update && sudo apt-get install -y osmium-tool

      - name: Install dependencies
        working-directory: scripts
        run: npm install

      - name: Extract ${{ matrix.region }}
        working-directory: scripts
        run: npm run extract-single -- --region ${{ matrix.region }}
        env:
          # 7168 was not enough for asia-japan: collectHighwaysNearBridges (BUG-278)
          # accumulates every highway near a bridge for the whole region, so peak memory
          # scales with region size and the largest region hits the ceiling first. The
          # redundant per-coordinate array copy that doubled this is removed in
          # extract-single.ts; this raises headroom for the accumulation that remains.
          # Runners have 16 GB, so 12 GB leaves room for the process's non-heap memory —
          # going much higher risks the OS OOM-killer (SIGKILL, no diagnostic) instead of
          # a clean V8 heap error.
          #
          # STRUCTURAL FOLLOW-UP: this is headroom, not a cure. The accumulator is still
          # unbounded, so a future OSM growth spurt reopens it. The real fix is to bound
          # it — process bridges in spatial batches so memory is independent of region
          # size. Tracked separately; not done here because it is a change to BUG-278's
          # design, not to tolls.
          NODE_OPTIONS: '--max-old-space-size=12288'

      - name: Build SQLite for ${{ matrix.region }}
        working-directory: scripts
        run: npm run build-sqlite -- --region ${{ matrix.region }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.region }}
          path: |
            scripts/output/${{ matrix.region }}.json.gz
            scripts/output/${{ matrix.region }}.sqlite.gz
          # Only the core .json.gz (region enumeration for generate-manifest) and the
          # .sqlite.gz (the ONLY file the app downloads) are uploaded. The -ways /
          # -surfaces / -builtup .json.gz are DELIBERATELY excluded: all that data
          # ships INSIDE the .sqlite, and the app never downloads them. Shipping them
          # made the release job pull ~58GB of artifacts onto a ~14GB-free runner →
          # disk OVERFLOW truncated large .sqlite.gz in transit (the 2026-07-03
          # europe-spain + 19-region corruption — Rods BUG-242 / BUG-243). Uploading
          # only these two cuts the release-job download to ~38GB so large files no
          # longer truncate. build-sqlite still reads -ways/-surfaces LOCALLY here.
          retention-days: 1  # Clean up quickly to save storage

  # Job 3: Combine all artifacts, generate manifest, create release
  # SAFETY: Skip release creation for single-region test runs — publishing a
  # partial release overwrites the "latest" tag and breaks all other regions
  # for every user. Single-region runs are for testing extraction only.
  release:
    needs: [get-regions, extract]
    runs-on: ubuntu-latest
    if: always() && needs.extract.result != 'cancelled' && inputs.single_region == ''
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space on the runner
        run: |
          echo "Disk before cleanup:"; df -h /
          # The release job downloads ~38GB of .sqlite.gz onto the runner's ~14GB-free
          # root disk. Reclaim ~30GB of preinstalled toolchains this job never uses so
          # large artifacts do NOT truncate mid-download (root cause of Rods BUG-242 /
          # BUG-243). Runs BEFORE setup-node so removing the tool cache is safe — Node
          # is (re)installed by the next step.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /opt/microsoft /usr/local/share/powershell /usr/share/swift 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          echo "Disk after cleanup:"; df -h /

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: scripts
        run: npm install

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-regions

      - name: Flatten artifacts
        run: |
          mkdir -p release-files
          find all-regions -name "*.json.gz" -exec mv {} release-files/ \;
          find all-regions -name "*.sqlite.gz" -exec mv {} release-files/ \;
          echo "Files to release:"
          ls -la release-files/
          echo "Total JSON files: $(ls release-files/*.json.gz 2>/dev/null | wc -l)"
          echo "Total SQLite files: $(ls release-files/*.sqlite.gz 2>/dev/null | wc -l)"

      - name: HARD GATE — every expected region must be present BEFORE publishing
        run: |
          # THE 2026-07-29 PARTIAL-RELEASE INCIDENT.
          #
          # asia-japan (heap OOM in the ways phase) and europe-germany-brandenburg
          # (corrupt PBF download) failed out of 236 jobs. `fail-fast: false` let the
          # other 234 finish — correct — but this job's `if: always()` then published a
          # release with 465 assets instead of 469, and GitHub marked it `latest`.
          # Every user needing Japan or Brandenburg got a 404 from
          # releases/latest/download/, which the app turns into an INFINITE
          # RE-DOWNLOAD LOOP (see docs/OSM_DATA_PIPELINE.md in the Rods repo).
          #
          # The existing verify-release gate below only proves the assets that ARE here
          # decompress. Integrity was guarded; COMPLETENESS was not. This gate closes
          # that: a release is all-or-nothing.
          #
          # Deliberately checks the assembled FILES, not job results — it also catches
          # an artifact that silently failed to upload or was lost in the flatten step,
          # which a `needs.extract.result` check would sail straight past.
          set -euo pipefail
          jq -r '.regions[].id' scripts/regions.json | sort > /tmp/expected.txt
          ls release-files/*.sqlite.gz 2>/dev/null | xargs -n1 basename 2>/dev/null \
            | sed 's/\.sqlite\.gz$//' | sort > /tmp/actual.txt || true

          EXPECTED_N=$(wc -l < /tmp/expected.txt)
          ACTUAL_N=$(wc -l < /tmp/actual.txt)
          echo "Expected regions: $EXPECTED_N"
          echo "Assembled  .sqlite.gz: $ACTUAL_N"

          MISSING=$(comm -23 /tmp/expected.txt /tmp/actual.txt || true)
          if [ -n "$MISSING" ]; then
            echo "::error::REFUSING TO PUBLISH — $(echo "$MISSING" | wc -l) region(s) missing from the release payload:"
            echo "$MISSING" | sed 's/^/::error::  missing: /'
            echo ""
            echo "A partial release becomes 'latest' and 404s those regions for every user."
            echo "Fix the failed region job(s), re-run, and only then publish."
            exit 1
          fi

          # Same check for the .json.gz side — the app reads both per region.
          ls release-files/*.json.gz 2>/dev/null | xargs -n1 basename 2>/dev/null \
            | sed 's/\.json\.gz$//' | sort > /tmp/actual-json.txt || true
          MISSING_JSON=$(comm -23 /tmp/expected.txt /tmp/actual-json.txt || true)
          if [ -n "$MISSING_JSON" ]; then
            echo "::error::REFUSING TO PUBLISH — region(s) missing their .json.gz:"
            echo "$MISSING_JSON" | sed 's/^/::error::  missing json: /'
            exit 1
          fi

          echo "✓ Completeness gate passed — all $EXPECTED_N regions present in both formats."

      - name: Generate manifest
        working-directory: scripts
        run: |
          npm run generate-manifest -- \
            --input ../release-files \
            --output ../release-files/manifest.json
          cat ../release-files/manifest.json | head -50

      - name: Verify every asset decompresses BEFORE publishing
        working-directory: scripts
        run: |
          # HARD GATE: decompress-test every region's .sqlite.gz in the assembled
          # payload before anything is published. A truncated asset passes the
          # size+checksum recorded in the manifest (both computed over the truncated
          # bytes) but fails gzip -t here — so a broken map file can never reach
          # users again (root cause of the 2026-07-03 europe-spain corruption that
          # hit ~53 users invisibly for a month — Rods BUG-242 / BUG-243).
          npm run verify-release -- --dir ../release-files --manifest ../release-files/manifest.json

      - name: Get release info
        id: release-info
        run: |
          VERSION=$(date +'%Y-%m-%d')
          MONTH_NAME=$(date +'%B %Y')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "month_name=${MONTH_NAME}" >> $GITHUB_OUTPUT
          echo "tag_name=osm-${VERSION}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.release-info.outputs.tag_name }}"
          TITLE="OSM Data - ${{ steps.release-info.outputs.month_name }}"

          # Delete existing release with same tag if it exists
          gh release delete "$TAG" --yes 2>/dev/null || true
          git tag -d "$TAG" 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true

          # Create the release
          gh release create "$TAG" \
            --title "$TITLE" \
            --notes "Monthly OSM data extraction.

          **Version:** ${{ steps.release-info.outputs.version }}

          **Contents (per region):**
          - Traffic calming features (speed bumps, dips, bridges, tunnels, speed cameras)
          - Roundabouts (full and mini)
          - Road surfaces (asphalt, gravel, cobblestone, dirt, etc.)
          - Road ways (dense road geometry for curve detection, incl. maxspeed + legal-context tags)
          - Built-up areas (landuse/place bboxes for urban-vs-rural speed-limit inference)

          **Usage:**
          Download manifest.json first to check versions, then download needed regions.

          **Files:**
          - manifest.json - Version and checksum info for all regions
          - {region-id}.sqlite.gz - Pre-built SQLite database (recommended)
          - {region-id}.json.gz - Core data (traffic calming + roundabouts) [legacy]
          - {region-id}-surfaces.json.gz - Road surface types [legacy]
          - {region-id}-ways.json.gz - Road geometry [legacy]"

          # Upload files in batches of 20 to avoid timeouts
          cd release-files
          FILES=(*)
          BATCH_SIZE=20
          for ((i=0; i<${#FILES[@]}; i+=BATCH_SIZE)); do
            BATCH=("${FILES[@]:i:BATCH_SIZE}")
            echo "Uploading batch $((i/BATCH_SIZE + 1)): ${#BATCH[@]} files..."
            gh release upload "$TAG" "${BATCH[@]}" --clobber
          done
          echo "All files uploaded successfully!"

      - name: Verify published release downloads + decompresses (final gate)
        working-directory: scripts
        run: |
          # Belt-and-suspenders over the pre-publish gate: stream every asset back
          # DOWN from the freshly-published release and decompress it, catching any
          # upload-layer truncation (e.g. hitting GitHub's HARD 1000-asset release
          # cap, which silently truncated the 2026-07-03 upload). Runs BEFORE
          # "Delete old releases" so the prior good releases are preserved if this
          # one is bad. This is the "every region downloads correctly before it's
          # called finished" gate.
          npm run verify-release -- \
            --manifest-url "https://github.com/${{ github.repository }}/releases/download/${{ steps.release-info.outputs.tag_name }}/manifest.json"

      - name: Delete old releases
        uses: dev-drprasad/delete-older-releases@v0.3.2
        with:
          keep_latest: 3
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## OSM Data Extraction Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.release-info.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Regions:** $(ls release-files/*.json.gz | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "**Total Size:** $(du -sh release-files | cut -f1)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Release created: [${{ steps.release-info.outputs.tag_name }}](../../releases/tag/${{ steps.release-info.outputs.tag_name }})" >> $GITHUB_STEP_SUMMARY
