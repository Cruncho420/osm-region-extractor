name: Verify Latest Release Manifest

# Purpose: Catch a broken map file in the latest release within 24h.
# It DECOMPRESSES every region's .sqlite.gz (gzip -t = whole DEFLATE stream +
# CRC32 + ISIZE) and also HEAD-checks Content-Length against the manifest.
#
# Why decompress and not just size: the 2026-07-03 release shipped a TRUNCATED
# europe-spain.sqlite.gz whose size + checksum matched manifest.json (both were
# computed over the already-truncated bytes). A size-only check reported "ok" for
# a month while ~53 users could not unpack the file (Rods BUG-242 / BUG-243). The
# only way to catch a truncated-but-self-consistent asset is to actually inflate
# it. This also still catches the original 2026-04-03 drift case (asset re-uploaded
# without regenerating the manifest) via the HEAD size check.

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC
  workflow_dispatch:      # Manual trigger for ad-hoc verification

permissions:
  contents: read
  issues: write  # Required to open an issue on failure

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: scripts
        run: npm install

      - name: Decompress-test every region in the latest release
        working-directory: scripts
        run: |
          set -o pipefail
          # Streams every published .sqlite.gz and runs gzip -t (whole DEFLATE
          # stream + CRC32 + ISIZE), plus a HEAD Content-Length check for manifest/
          # asset DRIFT. Replaces the old HEAD-size-only check, which passed a
          # truncated-but-size-consistent asset (europe-spain, 2026-07-03) straight
          # through to users because the manifest size was itself computed over the
          # truncated bytes — Rods BUG-242 / BUG-243. A non-zero exit fails the job.
          npm run verify-release -- \
            --manifest-url "https://github.com/${{ github.repository }}/releases/latest/download/manifest.json" \
            2>&1 | tee verify-output.txt

      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Deduplicate: update the existing open issue instead of opening a new one.
          TITLE="Release integrity failure in latest release"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')

          BODY=$(cat <<EOF
          The \`verify-manifest\` workflow decompress-tested every region in the latest
          release and one or more assets are **truncated / corrupt / missing** or their
          size disagrees with \`manifest.json\`. Affected clients reject the download and
          retry forever, or fail on-device at decompress / SQLite open (Rods BUG-242 /
          BUG-243).

          ### Output (tail)
          \`\`\`
          $(tail -c 6000 scripts/verify-output.txt 2>/dev/null || echo "see workflow logs")
          \`\`\`

          ### How to fix
          Re-run the **Monthly OSM Data Extraction** workflow as a FULL run (not a
          single-region dispatch — single-region runs never publish). Extraction now
          decompress-tests every region both before and after publishing, so a truncated
          asset cannot ship. A pure manifest/size drift (asset re-uploaded without
          regenerating the manifest) can instead be repaired via the
          \`regenerate-manifest\` workflow against the affected tag.

          _Detected automatically by \`.github/workflows/verify-manifest.yml\`._
          EOF
          )

          if [ -n "$EXISTING" ]; then
            echo "Updating existing issue #$EXISTING"
            gh issue comment "$EXISTING" --body "$BODY"
          else
            echo "Opening new issue"
            gh issue create --title "$TITLE" --body "$BODY" --label "bug"
          fi
