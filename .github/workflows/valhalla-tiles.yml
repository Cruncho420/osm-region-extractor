name: Valhalla Graph Tiles (Smoke)

# Purpose: Build Valhalla routing graph tiles for a SMOKE-TEST set of regions (FEAT-033 P1.1).
# Goal: prove the tile-build recipe in CI on 3 regions before any wider rollout.
#
# This workflow is STANDALONE and dispatch-only:
# - It never touches the monthly `osm-extract` pipeline, its releases, or manifest.json.
# - It publishes to its own `valhalla-smoke-<run_number>` tag, ALWAYS as a PRERELEASE:
#   the app and verify-manifest.yml resolve `releases/latest/download/manifest.json`,
#   and only a prerelease is guaranteed to never become "latest".
# - Enabling more regions is OWNER-GATED. A region builds only if it has a hardcoded
#   sanity-route entry below — a pack must never ship unverified.
#
# Recipe (proven in the Rods FEAT-033 Track B spike; P1.6 app contract on top):
# 1. valhalla_build_config     — tile_dir mode for BUILDING, concurrency 2,
#                                max_cache_size 262144000, admin + timezone sqlite paths
# 2. valhalla_build_timezones  — ONCE (world-wide tz_world.sqlite ~114MB, cached monthly)
# 3. valhalla_build_admins     — per region (seconds to minutes)
# 4. valhalla_build_tiles      — per region, with VERIFY-AND-RETRY:
#    Large regions CRASH at concurrency 2 with "Mismatch in end offset ... Tile file
#    might be corrupted" (tile-writer race; California reproduced it, clean at c1).
#    So: PBF > 600MB starts at concurrency 1; ANY failure or corruption marker in the
#    log wipes the tile dir and retries once at concurrency 1.
# 5. Package with valhalla_build_extract (P1.6 contract): the shipped asset
#    {regionId}-valhalla.tar.gz is a gzip of the SINGLE tar that mjolnir.tile_extract
#    memory-maps — build_extract writes the index.bin the engine expects, so a
#    hand-rolled `tar cf` of the tile dir is FORBIDDEN. Engine and extract tool both
#    run from ONE digest-pinned image ($VALHALLA_REF, resolved at pull time).
#    Still GRAPH-ONLY: tz_world.sqlite / admins.sqlite are build-time inputs.
# 6. Gates before an artifact is accepted:
#    - extract structure: index.bin present + at least one .gph tile in the tar
#    - size band: gz must be 10%..300% of a rough 0.39 x PBF-size estimate
#    - sanity route: one-shot valhalla_service in TILE_EXTRACT mode against the tar
#      GUNZIPPED FROM THE SHIPPED ASSET must return "Found route" (a pack that routes
#      in tile_dir mode but not tile_extract mode must fail the job)
# 7. P1.8 corridors: the full verified route response ships as
#    {regionId}-corridors.json (array of {name, request, response}).
#
# Manifest: the smoke release ships its own manifest.json (+ legacy copy
# valhalla-manifest.json) with per-region valhallaSize / valhallaChecksum — the
# 16-hex sha256 prefix, EXACTLY like computeChecksum() in scripts/generate-manifest.ts
# (which now also emits these fields when {regionId}-valhalla.tar.gz sits in its
# input dir). The monthly release sits at ~937 assets against GitHub's HARD
# 1000-asset cap (see the -builtup.json.gz note in osm-extract.yml), so 233 valhalla
# tars can never ride the monthly release — production rollout needs its own
# `valhalla-<date>` release. Exact steps: see MANIFEST-INTEGRATION.md at the repo root.

on:
  # The branch-scoped `push` registration shim that lived here was REMOVED at the
  # merge to main, as its own comment instructed. It existed because GitHub will
  # not register workflow_dispatch for a workflow that has only ever existed on a
  # feature branch; a workflow on the DEFAULT branch is registered by definition,
  # so the shim has no remaining purpose and would only leave a trigger pointing
  # at a branch that gets deleted.
  #
  # Dispatch-only is a property this workflow depends on, not an accident: a build
  # here is hours long and publishes a release, so it must never be startable by a
  # commit. Every job is additionally gated on
  # `github.event_name == 'workflow_dispatch'`; keep both.
  workflow_dispatch:
    inputs:
      regions:
        description: 'Comma list of regions (region id, id suffix, or geofabrik path fragment)'
        required: false
        default: 'estonia,bayern,us/california'
        type: string
      upload:
        description: 'Upload packs to a valhalla-smoke-<run_number> prerelease'
        required: false
        default: true
        type: boolean
      tag:
        description: 'Prerelease tag override (must start with valhalla-smoke-). Empty = valhalla-smoke-<run_number>'
        required: false
        default: ''
        type: string
      prune_old_smoke:
        description: 'Delete older valhalla-smoke-* prereleases after upload'
        required: false
        default: true
        type: boolean

permissions:
  contents: write  # Required for creating the smoke prerelease

# NO workflow-level concurrency group. An earlier version had one, keyed on the
# tag, with cancel-in-progress:false and a comment claiming "queue, never
# cancel". That comment was WRONG and the group was actively harmful: GitHub's
# concurrency queue holds exactly ONE pending run per group and cancels any
# previously pending one. cancel-in-progress:false protects the RUNNING batch,
# not the QUEUED one — so dispatching batches 2 and 3 while batch 1 built would
# silently cancel batch 2. A whole batch of regions would never build, with no
# error annotation, and the operator would believe the rollout was complete.
#
# The race it was added to prevent — two batches both finding the release absent
# and both calling `gh release create` — is handled where it actually occurs, in
# prepare-release, by tolerating a lost create. That fix is correct for any
# number of concurrent batches; the queue was not.

env:
  VALHALLA_IMAGE: ghcr.io/valhalla/valhalla:latest
  # Hardcoded in-region sanity route endpoints, "lat,lon|lat,lon" (city pairs).
  # A region WITHOUT an entry here fails fast ON PURPOSE: the sanity route is the
  # only end-to-end proof the shipped pack can actually route. Generalize this
  # (e.g. per-region pairs in regions.json) before any wider rollout.
  # Curated sanity pairs. A region listed here SKIPS derivation entirely
  # (scripts/derive-sanity-route.mjs); anything not listed derives its own.
  #
  # WHEN A REGION NEEDS AN ENTRY HERE — two distinct reasons, and the second one
  # is invisible until it bites:
  #
  # 1. GRID SAMPLING CANNOT FIND THE ROADS. Derivation drops a grid over the
  #    region's bounding box. For an ocean-dominated region almost every sample
  #    lands in water — north-america-us-hawaii's bbox is 223 deg² and over 99%
  #    open Pacific. Densifying does not rescue it: measured, a 21×21 grid still
  #    steps over Oahu.
  #
  # 2. THE TWO POINTS LAND ON LANDMASSES WITH NO ROAD BETWEEN THEM. This one no
  #    sampler can ever fix, however good, because the pair is individually valid
  #    and jointly unroutable — and it fails identically to a broken pack, so it
  #    would send someone to debug tile generation for tiles that are fine.
  #    Real cases, all of them ferry-or-air only by road:
  #      japan        Hokkaido ↔ Honshu — the Seikan tunnel is RAIL ONLY
  #      new-zealand  North ↔ South Island — Cook Strait ferry
  #      australia    Tasmania ↔ mainland
  #      canada       Iqaluit and most of Nunavut are fly-in
  #      russia       Norilsk, Magadan and much of the far north are fly-in
  #      us-hawaii / philippines / indonesia / greece / croatia / denmark /
  #      us-virgin-islands — archipelagos throughout
  #
  # So every pair below is deliberately BOTH ENDS ON ONE ROAD-CONNECTED LANDMASS
  # (named in the comment), far enough apart to traverse the graph rather than
  # sit in one city. Each coordinate was checked to fall inside that region's own
  # bbox in scripts/regions.json.
  SANITY_ROUTES: >-
    {"europe-estonia":"59.437,24.754|58.378,26.729",
    "europe-germany-bayern":"48.137,11.575|49.454,11.077",
    "europe-lithuania":"54.687,25.280|54.897,23.914",
    "north-america-us-california":"34.05,-118.24|32.72,-117.16",
    "north-america-us-hawaii":"21.307,-157.858|21.593,-158.104",
    "asia-indonesia":"-6.208,106.846|-6.917,107.619",
    "asia-philippines":"14.599,120.984|16.402,120.596",
    "asia-japan":"35.690,139.692|34.694,135.502",
    "australia-oceania-new-zealand":"-36.848,174.763|-37.787,175.279",
    "australia-oceania-australia":"-33.868,151.209|-35.282,149.128",
    "europe-greece":"37.983,23.727|40.640,22.944",
    "europe-croatia":"45.815,15.982|43.508,16.440",
    "europe-denmark":"56.162,10.204|57.048,9.922",
    "europe-cyprus":"35.185,33.382|34.707,33.022",
    "north-america-us-us-virgin-islands":"17.747,-64.703|17.714,-64.883",
    "north-america-us-alaska":"61.218,-149.900|64.838,-147.716",
    "north-america-canada":"43.653,-79.383|45.421,-75.697",
    "asia-russia":"55.756,37.617|56.297,43.936",
    "europe-italy":"41.903,12.496|45.464,9.190",
    "europe-spain":"40.417,-3.704|41.385,2.173",
    "europe-great-britain":"51.507,-0.128|53.480,-2.243"}
  # Landmass per pair, for the record:
  #   hawaii Oahu (Honolulu→Haleiwa) · indonesia Java (Jakarta→Bandung)
  #   philippines Luzon (Manila→Baguio) · japan Honshu (Tokyo→Osaka)
  #   new-zealand North Is (Auckland→Hamilton) · australia mainland (Sydney→Canberra)
  #   greece mainland (Athens→Thessaloniki) · croatia mainland (Zagreb→Split)
  #   denmark Jutland (Aarhus→Aalborg) · cyprus south (Nicosia→Limassol)
  #   us-virgin-islands St Croix · alaska road system (Anchorage→Fairbanks)
  #   canada Ontario (Toronto→Ottawa) · russia west (Moscow→Nizhny Novgorod)
  #   italy mainland (Rome→Milan) · spain mainland (Madrid→Barcelona)
  #   great-britain the GB island (London→Manchester)
  #
  # Italy/Spain/GB are mainland-plus-islands, added 2026-08-06 after the runner-
  # budget run: Sardinia and Sicily have no road to the Italian mainland, the
  # Balearics none to Spain, and the GB extract carries Wight/Hebrides/Orkney. A
  # derived pair can legitimately straddle one of those and be unroutable.
  # FRANCE deliberately absent: it is split into sub-regions and Corsica is its
  # OWN region, so no French region contains two disconnected landmasses.

jobs:
  # Job 1: Resolve the comma-list input to canonical region ids from regions.json
  get-regions:
    if: github.event_name == 'workflow_dispatch'  # push events only register the workflow
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve region tokens to region ids
        id: resolve
        env:
          REGIONS_INPUT: ${{ inputs.regions }}
        run: |
          set -euo pipefail
          if [ -z "${REGIONS_INPUT// /}" ]; then
            echo "::error::No regions provided"
            exit 1
          fi
          IDS=""
          IFS=',' read -ra TOKENS <<< "$REGIONS_INPUT"
          for tok in "${TOKENS[@]}"; do
            tok="$(echo "$tok" | tr -d '[:space:]')"
            [ -z "$tok" ] && continue
            # Exact id match wins; otherwise match id suffix or geofabrik path fragment
            # (lets "estonia", "bayern", "us/california" resolve to canonical ids).
            MATCHES=$(jq -r --arg t "$tok" '
              [.regions[] | select(.id == $t)] as $exact
              | (if ($exact | length) > 0 then $exact
                 else [.regions[] | select((.id | endswith($t)) or (.geofabrikPath | contains($t)))]
                 end)
              | [.[].id] | unique | .[]' scripts/regions.json)
            N=$(printf '%s' "$MATCHES" | grep -c . || true)
            if [ "$N" -eq 0 ]; then
              echo "::error::Region token '$tok' matches nothing in scripts/regions.json"
              exit 1
            fi
            if [ "$N" -gt 1 ]; then
              echo "::error::Region token '$tok' is ambiguous — matches: $(echo $MATCHES | tr '\n' ' ')"
              exit 1
            fi
            IDS="${IDS}${MATCHES}"$'\n'
          done
          MATRIX=$(printf '%s' "$IDS" | grep . | sort -u | jq -R . | jq -sc .)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Resolved regions: $MATRIX"

  # Job 1b: resolve the tag ONCE and make sure the release exists before any
  # region finishes, because each build job now uploads its own asset.
  #
  # ── WHY THE PUBLISH SHAPE CHANGED (LEG 3.7, 2026-08-09) ────────────────────
  #
  # This used to be: every region uploads a build ARTIFACT, then one release job
  # downloads them all and publishes. Three properties of that shape are invisible
  # at 3-region smoke scale and fatal at 234:
  #
  #   1. `if: needs.build.result == 'success'` — fail-fast is false, so ONE failed
  #      region still marks the matrix failed, and after ~20 hours of building
  #      NOTHING gets published.
  #   2. The release job downloaded every artifact onto one runner. At 234 regions
  #      that is ~45 GB against a runner with far less free disk.
  #   3. `gh release delete "$TAG"` ran first, so a second batch against the same
  #      tag DELETED the first batch's assets.
  #
  # So each build job uploads its own tar the moment it has passed the sanity
  # gate, and the final job only collects the tiny per-region report JSONs. A
  # failed region now costs that region, not the run; re-running dispatches just
  # the failed ids and --clobber replaces them in place.
  prepare-release:
    needs: get-regions
    # NOT gated on inputs.upload. `build` needs this job, and a SKIPPED dependency
    # skips the dependent — so gating here would make `upload: false` (the
    # measure-only mode the 2026-08-06 timing run used) build nothing at all.
    # Resolving the tag costs seconds and is harmless; only the release CREATION
    # below is gated.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.info.outputs.tag_name }}
      version: ${{ steps.info.outputs.version }}
      channel: ${{ steps.info.outputs.channel }}
    steps:
      - name: Resolve tag + dataVersion
        id: info
        run: |
          set -euo pipefail
          # Two tag shapes, and the VERSION rule differs between them — this is the
          # whole of LEG 3.4 and getting it wrong 404s every download.
          #
          #   valhalla-smoke-<n>      throwaway CI proof. VERSION = today.
          #   valhalla-<YYYY-MM-DD>   PRODUCTION packs. VERSION = THE DATE IN THE TAG.
          #
          # Why production takes its version from the tag instead of the clock: the
          # app and verify-release build their download URL as
          # `releases/download/valhalla-${manifestVersion}/{region}-valhalla.tar.gz`,
          # where manifestVersion is the MONTHLY manifest's version. That monthly
          # release is cut on its own date, and this job may run days later. Stamping
          # today's date would publish `valhalla-2026-08-06` while every client asks
          # for `valhalla-2026-08-02` — a 404 for every region, from a run that
          # reported success. The tag IS the contract; the clock is not.
          TAG_INPUT="${{ inputs.tag }}"
          if [ -n "$TAG_INPUT" ]; then
            case "$TAG_INPUT" in
              valhalla-smoke-*)
                TAG="$TAG_INPUT"; VERSION=$(date +'%Y-%m-%d'); CHANNEL=smoke ;;
              valhalla-[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9])
                TAG="$TAG_INPUT"; VERSION="${TAG_INPUT#valhalla-}"; CHANNEL=production ;;
              *)
                echo "::error::tag input '$TAG_INPUT' must be 'valhalla-smoke-<n>' or 'valhalla-<YYYY-MM-DD>'"
                exit 1 ;;
            esac
          else
            TAG="valhalla-smoke-${{ github.run_number }}"
            VERSION=$(date +'%Y-%m-%d')
            CHANNEL=smoke
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
          echo "Channel: $CHANNEL   Tag: $TAG   dataVersion: $VERSION"

      - name: Create the release if it does not exist
        if: inputs.upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # -R on every gh call here, because this job deliberately has NO
          # actions/checkout: it needs no repo files, only the API. Without a git
          # working directory `gh` cannot infer the repository and dies with
          # "failed to run git: fatal: not a git repository" — which the 1-region
          # smoke caught on its first dispatch (run 31356420479), before any
          # region had been built.
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${{ steps.info.outputs.tag_name }}"
          # NEVER `gh release delete` here. Batched dispatches against one
          # production tag are the intended workflow, and deleting would discard
          # every region a previous batch published. Existing = reuse, always.
          if gh release view "$TAG" -R "$REPO" > /dev/null 2>&1; then
            echo "Release $TAG already exists — appending to it."
            exit 0
          fi
          # Between the check above and the create below, a concurrently
          # dispatched batch can create the same release. Losing that race is
          # NORMAL and must not fail this batch — its regions would then never
          # upload, silently. So a failed create is only fatal if the release
          # still does not exist afterwards.
          create_or_accept_race() {
            if gh release create "$@" -R "$REPO"; then
              return 0
            fi
            echo "gh release create failed — checking whether a concurrent batch won the race"
            if gh release view "$TAG" -R "$REPO" > /dev/null 2>&1; then
              echo "Release $TAG now exists (created by a concurrent run) — continuing."
              return 0
            fi
            echo "::error::Release $TAG could not be created and does not exist."
            return 1
          }
          if [ "${{ steps.info.outputs.channel }}" = production ]; then
            TITLE="Valhalla Routing Packs - ${{ steps.info.outputs.version }}"
            LEAD="PRODUCTION Valhalla routing packs (FEAT-033). Consumed by the app: the pack URL is built as releases/download/$TAG/{region}-valhalla.tar.gz, pinned to the manifest version, so this tag MUST match the monthly manifest's version."
          else
            TITLE="Valhalla Routing Packs (smoke) - ${{ steps.info.outputs.version }}"
            LEAD="SMOKE-TEST Valhalla routing packs (FEAT-033 P1.6 app contract). Not consumed by any production client."
          fi
          # --prerelease on BOTH channels, production included. The app and
          # verify-manifest.yml resolve releases/latest/download/manifest.json, and
          # this release also carries a manifest.json asset — the moment it stopped
          # being a prerelease it would become `latest` and every client would fetch
          # THIS manifest, which lists only valhalla fields, instead of the real one.
          # Nothing here needs `latest`: the pack URL is version-pinned by tag.
          create_or_accept_race "$TAG" \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "$TITLE" \
            --notes "$LEAD

          **dataVersion:** ${{ steps.info.outputs.version }}

          Assets are uploaded per region as each build job finishes. A region missing from this release FAILED to build — see the workflow run summary.

          **Contents (per region):**
          - {region-id}-valhalla.tar.gz - gzip of the SINGLE valhalla_build_extract tar (index.bin + graph tiles) that mjolnir.tile_extract memory-maps; GRAPH-ONLY (no tz/admin sqlite)
          - {region-id}-corridors.json - P1.8 corridor fixtures: array of {name, request, response} with the FULL valhalla route response from CI verification
          - manifest.json / valhalla-manifest.json - per-region valhallaSize + valhallaChecksum (sha256 first 16 hex), written by the finalize job once every region has reported"
          echo "Created $TAG"

  # Job 2: Build + verify + package one region per matrix job
  build:
    needs: [get-regions, prepare-release]
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      matrix:
        region: ${{ fromJson(needs.get-regions.outputs.matrix) }}
      # 6, not 3. Measured 2026-08-06: the largest region (asia-russia) takes
      # 37 min, ~10% of the 6 h job cap, so the per-job risk of more parallelism
      # is nil — but at 234 regions the SERIAL cost is the whole run, roughly
      # 16 h of build time. Public-repo runners allow 20 concurrent jobs; 6
      # halves the wall clock while leaving headroom for the monthly extract to
      # run alongside without queueing behind this.
      max-parallel: 6
      fail-fast: false  # One region failing must not kill the others
    env:
      REGION: ${{ matrix.region }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve region metadata
        id: meta
        run: |
          set -euo pipefail
          GEO_PATH=$(jq -r --arg id "$REGION" '.regions[] | select(.id==$id) | .geofabrikPath' scripts/regions.json)
          if [ -z "$GEO_PATH" ] || [ "$GEO_PATH" = "null" ]; then
            echo "::error::Region $REGION not found in scripts/regions.json"
            exit 1
          fi
          # Curated pair if one exists, otherwise EMPTY — the sanity step derives
          # it from the built tiles (scripts/derive-sanity-route.mjs). This used
          # to `exit 1` on a missing entry, which meant 230 of 234 regions could
          # never be built at all. The gate itself is unchanged: a pack still
          # never ships unverified, the endpoints are just no longer required to
          # be hand-written.
          COORDS=$(jq -rn --argjson m "$SANITY_ROUTES" --arg id "$REGION" '$m[$id] // empty')
          echo "geo_path=$GEO_PATH" >> "$GITHUB_OUTPUT"
          echo "coords=$COORDS" >> "$GITHUB_OUTPUT"
          echo "Region: $REGION  PBF: $GEO_PATH  Sanity route: ${COORDS:-<derive from tiles>}"

      - name: Download PBF from Geofabrik
        id: pbf
        run: |
          set -euo pipefail
          mkdir -p work
          URL="https://download.geofabrik.de/${{ steps.meta.outputs.geo_path }}"
          echo "URL: $URL"
          curl -fL --retry 3 --retry-delay 30 --connect-timeout 30 -o work/region.osm.pbf "$URL"
          PBF_BYTES=$(stat -c%s work/region.osm.pbf)
          echo "pbf_bytes=$PBF_BYTES" >> "$GITHUB_OUTPUT"
          echo "pbf_mb=$((PBF_BYTES / 1024 / 1024))" >> "$GITHUB_OUTPUT"
          echo "PBF size: $((PBF_BYTES / 1024 / 1024)) MB"
          df -h / | tail -1

      - name: Pull Valhalla image and pin its digest
        run: |
          set -euo pipefail
          # P1.6 contract: valhalla_build_tiles, valhalla_build_extract AND the
          # verifying valhalla_service must all come from ONE image SHA — a :latest
          # tag moving mid-job could pair an engine with a foreign extract format.
          # Pin the pulled digest once and use $VALHALLA_REF everywhere below.
          docker pull -q "$VALHALLA_IMAGE"
          VALHALLA_REF=$(docker inspect --format '{{index .RepoDigests 0}}' "$VALHALLA_IMAGE")
          if [ -z "$VALHALLA_REF" ]; then
            echo "::error::Could not resolve digest for $VALHALLA_IMAGE"
            exit 1
          fi
          echo "VALHALLA_REF=$VALHALLA_REF" >> "$GITHUB_ENV"
          echo "Pinned Valhalla image: $VALHALLA_REF"

      - name: Compute timezone cache key (month-scoped)
        id: tzkey
        run: echo "month=$(date +'%Y-%m')" >> "$GITHUB_OUTPUT"

      - name: Restore world timezone DB from cache
        uses: actions/cache@v4
        with:
          path: work/tz_world.sqlite
          key: valhalla-tzdata-${{ steps.tzkey.outputs.month }}

      - name: Ensure world timezone DB (build on cache miss)
        run: |
          set -euo pipefail
          # tz_world.sqlite is world-wide (~114MB) and region-independent: build once,
          # reuse across regions and runs via the month-scoped cache above.
          if [ -s work/tz_world.sqlite ] && [ "$(stat -c%s work/tz_world.sqlite)" -ge 50000000 ]; then
            echo "tz_world.sqlite from cache: $(stat -c%s work/tz_world.sqlite) bytes"
          else
            echo "Cache miss — building timezone DB"
            docker run --rm "$VALHALLA_REF" valhalla_build_timezones > work/tz_world.sqlite
            SIZE=$(stat -c%s work/tz_world.sqlite)
            echo "Built tz_world.sqlite: $SIZE bytes"
            if [ "$SIZE" -lt 50000000 ]; then
              echo "::error::tz_world.sqlite too small ($SIZE bytes) — timezone build failed"
              exit 1
            fi
          fi

      - name: Generate Valhalla configs (tile_dir mode)
        run: |
          set -euo pipefail
          # tile_dir mode: tile_extract points at a file that never exists, so every
          # tool and the sanity service read loose tiles from tile_dir.
          docker run --rm -v "$PWD/work:/data" "$VALHALLA_REF" valhalla_build_config \
            --mjolnir-tile-dir /data/valhalla_tiles \
            --mjolnir-tile-extract /data/unused-tile-extract.tar \
            --mjolnir-timezone /data/tz_world.sqlite \
            --mjolnir-admin /data/admins.sqlite \
            > work/valhalla-base.json
          # Set concurrency/cache via jq (not CLI flags) so a flag-name drift in
          # valhalla_build_config can never silently leave defaults in place.
          jq '.mjolnir.concurrency = 2 | .mjolnir.max_cache_size = 262144000' \
            work/valhalla-base.json > work/valhalla.json
          jq '.mjolnir.concurrency = 1' work/valhalla.json > work/valhalla-c1.json
          echo "mjolnir config: $(jq -c '.mjolnir | {tile_dir, tile_extract, concurrency, max_cache_size, admin, timezone}' work/valhalla.json)"

      - name: Build admin DB for ${{ matrix.region }}
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/work:/data" "$VALHALLA_REF" \
            valhalla_build_admins -c /data/valhalla.json /data/region.osm.pbf
          ls -la work/admins.sqlite

      - name: Build graph tiles (verify-and-retry)
        id: tiles
        run: |
          set -euo pipefail
          PBF_BYTES=${{ steps.pbf.outputs.pbf_bytes }}
          THRESHOLD=629145600  # 600 MB
          # Spike-proven: large regions hit a tile-writer race at concurrency 2
          # ("Mismatch in end offset"); start big PBFs at concurrency 1.
          if [ "$PBF_BYTES" -gt "$THRESHOLD" ]; then
            CFG=/data/valhalla-c1.json; CONC=1
            echo "Initial build concurrency: 1 (PBF $((PBF_BYTES / 1024 / 1024)) MB > 600MB threshold — c1 fallback ENGAGED)"
          else
            CFG=/data/valhalla.json; CONC=2
            echo "Initial build concurrency: 2 (PBF $((PBF_BYTES / 1024 / 1024)) MB <= 600MB threshold)"
          fi

          build_tiles() {
            local cfg="$1" log="$2" rc=0
            set +e
            docker run --rm -v "$PWD/work:/data" "$VALHALLA_REF" \
              valhalla_build_tiles -c "$cfg" /data/region.osm.pbf 2>&1 | tee "$log"
            rc=${PIPESTATUS[0]}
            set -e
            if [ "$rc" -ne 0 ]; then
              echo "valhalla_build_tiles exit code: $rc"
              return 1
            fi
            if grep -qE "Mismatch in end offset|terminate called" "$log"; then
              echo "Corruption marker found in build log despite exit 0"
              return 1
            fi
            return 0
          }

          RETRIED=0
          T0=$(date +%s)
          if ! build_tiles "$CFG" work/build-attempt1.log; then
            echo "::warning::[$REGION] first tile build failed or showed corruption markers — wiping tile dir and retrying once at concurrency 1"
            RETRIED=1
            CONC=1
            sudo rm -rf work/valhalla_tiles
            if ! build_tiles /data/valhalla-c1.json work/build-attempt2.log; then
              echo "::error::[$REGION] valhalla_build_tiles failed twice — refusing to ship a possibly corrupt pack"
              exit 1
            fi
          fi
          T1=$(date +%s)
          echo "tiles_seconds=$((T1 - T0))" >> "$GITHUB_OUTPUT"
          echo "concurrency=$CONC" >> "$GITHUB_OUTPUT"
          echo "retried=$RETRIED" >> "$GITHUB_OUTPUT"
          echo "Tile build wall-time: $((T1 - T0))s (concurrency $CONC, retried=$RETRIED)"
          df -h / | tail -1

      - name: Package via valhalla_build_extract + size gate
        id: pack
        run: |
          set -euo pipefail
          # PBF no longer needed once tiles exist (retry path is behind us) — free disk
          sudo rm -f work/region.osm.pbf
          if [ ! -d work/valhalla_tiles/2 ]; then
            echo "::error::[$REGION] graph level 2 (local roads) missing — empty/corrupt build"
            exit 1
          fi
          LEVELS=""
          for d in 0 1 2; do
            [ -d "work/valhalla_tiles/$d" ] && LEVELS="$LEVELS $d"
          done
          echo "Graph levels present:$LEVELS"

          # P1.6 contract: the shipped tar MUST come from valhalla_build_extract —
          # it writes the index the engine memory-maps in mjolnir.tile_extract mode.
          # A hand-rolled `tar cf` of the tile dir has no index and is FORBIDDEN.
          # Same digest-pinned image ($VALHALLA_REF) as the tile build: engine and
          # extract tool from ONE SHA. Still GRAPH-ONLY (tz/admin sqlite never ship).
          rm -f work/valhalla_extract.tar
          jq '.mjolnir.tile_extract = "/data/valhalla_extract.tar"' \
            work/valhalla.json > work/valhalla-extract.json
          docker run --rm -v "$PWD/work:/data" "$VALHALLA_REF" \
            valhalla_build_extract -c /data/valhalla-extract.json -v
          if [ ! -s work/valhalla_extract.tar ]; then
            echo "::error::[$REGION] valhalla_build_extract produced no tar"
            exit 1
          fi

          # Structural gate: the extract must carry index.bin + graph tiles
          sudo tar -tf work/valhalla_extract.tar > extract-toc.txt
          if ! grep -qE '(^|/)index\.bin$' extract-toc.txt; then
            echo "::error::[$REGION] extract tar has no index.bin — not a valid tile_extract"
            exit 1
          fi
          GPH_COUNT=$(grep -cE '\.gph$' extract-toc.txt || true)
          if [ "$GPH_COUNT" -eq 0 ]; then
            echo "::error::[$REGION] extract tar contains no .gph tiles"
            exit 1
          fi
          echo "Extract structure OK: index.bin + $GPH_COUNT .gph tiles"

          # Loose tiles no longer needed — the extract IS the artifact; free disk
          sudo rm -rf work/valhalla_tiles
          sudo gzip -f work/valhalla_extract.tar
          sudo mv work/valhalla_extract.tar.gz "${REGION}-valhalla.tar.gz"
          sudo chown "$(id -u):$(id -g)" "${REGION}-valhalla.tar.gz"
          sha256sum "${REGION}-valhalla.tar.gz" > "${REGION}-valhalla.tar.gz.sha256"

          GZ_BYTES=$(stat -c%s "${REGION}-valhalla.tar.gz")
          PBF_BYTES=${{ steps.pbf.outputs.pbf_bytes }}
          EST=$((PBF_BYTES * 39 / 100))   # rough gz estimate: 0.39 x PBF size
          MIN=$((EST / 10))               # <10% of estimate = suspiciously empty
          MAX=$((EST * 3))                # >300% of estimate = suspiciously bloated
          echo "Pack: $((GZ_BYTES / 1024 / 1024)) MB (estimate $((EST / 1024 / 1024)) MB, band $((MIN / 1024 / 1024))..$((MAX / 1024 / 1024)) MB)"
          if [ "$GZ_BYTES" -lt "$MIN" ] || [ "$GZ_BYTES" -gt "$MAX" ]; then
            echo "::error::[$REGION] pack size $GZ_BYTES outside sanity band [$MIN, $MAX] — possible empty/corrupt output"
            exit 1
          fi
          SHA=$(cut -d' ' -f1 "${REGION}-valhalla.tar.gz.sha256")
          echo "gz_bytes=$GZ_BYTES" >> "$GITHUB_OUTPUT"
          echo "gz_mb=$((GZ_BYTES / 1024 / 1024))" >> "$GITHUB_OUTPUT"
          echo "gph_count=$GPH_COUNT" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "sha16=${SHA:0:16}" >> "$GITHUB_OUTPUT"

      - name: Sanity route against the SHIPPED pack (tile_extract mode)
        id: sanity
        run: |
          set -euo pipefail
          # Verify the EXACT artifact we ship, in the EXACT mode the app runs it:
          # gunzip the shipped .tar.gz and serve it via mjolnir.tile_extract
          # (memory-mapped tar). tile_dir points at a path that does not exist and
          # the loose tile dir was already deleted, so the service can ONLY answer
          # from the extract — a pack that routes in tile_dir mode but not
          # tile_extract mode fails RIGHT HERE. Catches gzip corruption too.
          gunzip -c "${REGION}-valhalla.tar.gz" > work/verify_extract.tar
          jq '.mjolnir.tile_extract = "/data/verify_extract.tar"
              | .mjolnir.tile_dir = "/data/no_such_tile_dir"' \
            work/valhalla.json > work/valhalla-verify.json

          COORDS='${{ steps.meta.outputs.coords }}'
          PAIRS=""
          if [ -n "$COORDS" ]; then
            echo "Using curated sanity pair for $REGION"
            PAIRS="$COORDS"
          else
            # Derive from the tiles we are about to ship. Runs against the
            # RE-EXTRACTED tar, not the build dir, so the endpoints are picked
            # from the exact artifact under test.
            echo "Deriving sanity endpoints from the built tiles..."
            # VALHALLA_REF (the resolved digest), not VALHALLA_IMAGE (:latest):
            # endpoints must be derived by the SAME image that then verifies them,
            # or a tag moving mid-job could pick endpoints one build can route and
            # another cannot — which would read as a bad pack.
            DERIVED=$(node scripts/derive-sanity-route.mjs \
              --region "$REGION" \
              --image "$VALHALLA_REF" \
              --mount "$PWD/work:/data" \
              --config /data/valhalla-verify.json | tail -n 1)
            echo "Derived: $DERIVED"
            LONG=$(echo "$DERIVED" | jq -r '.long')
            URBAN=$(echo "$DERIVED" | jq -r '.urban // empty')
            [ -n "$LONG" ] && PAIRS="$LONG"
            # The long-haul pair only proves the motorway hierarchy connects.
            # Rods drives secondary roads, so the short intra-urban pair is
            # verified too when one could be derived.
            [ -n "$URBAN" ] && PAIRS="$PAIRS $URBAN"
          fi

          # MERGE NOTE (2026-08-05): both sides of this hunk were load-bearing and
          # neither survives alone. LEG 3.1 (this branch) made the endpoints
          # DERIVED and plural, so a pack is verified on the motorway hierarchy
          # AND on a short intra-urban pair — the long-haul route alone proves
          # only that trunk roads connect, and Rods drives secondary roads. The
          # P1.6/P1.8 contract (origin) made a single check TRUSTWORTHY: pinned
          # image digest, stdout/stderr split to files, the response parsed out of
          # log noise, an actual `.trip.legs` assertion rather than grepping for a
          # success string, and the verified response shipped as the corridors
          # asset. Taking either side alone would have silently dropped the other's
          # guarantee, so the loop below is the plural form of the strict check.
          if [ -z "$PAIRS" ]; then
            echo "::error::[$REGION] no sanity endpoints (curated or derived) — pack rejected"
            exit 1
          fi

          PASSED=0
          IDX=0
          CORRIDORS='[]'
          for PAIR in $PAIRS; do
            A="${PAIR%|*}"; B="${PAIR#*|}"
            LAT1="${A%,*}"; LON1="${A#*,}"; LAT2="${B%,*}"; LON2="${B#*,}"
            REQ="{\"locations\":[{\"lat\":$LAT1,\"lon\":$LON1},{\"lat\":$LAT2,\"lon\":$LON2}],\"costing\":\"auto\"}"
            # First pair is the long-haul one (derive-sanity-route emits it first,
            # and a curated COORDS entry is a single long pair), so it keeps the
            # name the app fixtures already reference.
            if [ "$IDX" -eq 0 ]; then NAME=primary; else NAME=urban; fi
            echo "Route request ($NAME): $REQ"
            set +e
            docker run --rm -v "$PWD/work:/data" "$VALHALLA_REF" \
              valhalla_service /data/valhalla-verify.json route "$REQ" \
              > work/route-stdout.log 2> work/route-stderr.log
            RC=$?
            set -e
            tail -n 15 work/route-stderr.log || true
            # The response is the last stdout line that is a JSON object — valhalla
            # log lines start with a timestamp, never '{'.
            grep -E '^\{' work/route-stdout.log | tail -n 1 > work/route-response.json || true
            # Three independent checks. "Found route" in the log is NOT sufficient
            # on its own — it can appear while the response carries no legs.
            if [ "$RC" -ne 0 ] \
               || ! cat work/route-stdout.log work/route-stderr.log | grep -q "Found route" \
               || ! jq -e '(.trip.legs | length) > 0' work/route-response.json > /dev/null 2>&1; then
              echo "::error::[$REGION] sanity route FAILED for $NAME pair in tile_extract mode (exit $RC) — pack rejected"
              exit 1
            fi
            echo "Sanity route OK ($NAME): $(jq -c '.trip.summary | {length, time}' work/route-response.json)"
            CORRIDORS=$(jq -n --argjson acc "$CORRIDORS" --arg name "$NAME" \
              --argjson req "$REQ" --slurpfile resp work/route-response.json \
              '$acc + [{name: $name, request: $req, response: $resp[0]}]')
            PASSED=$((PASSED + 1))
            IDX=$((IDX + 1))
          done
          echo "Sanity route OK (tile_extract mode): $PASSED pair(s) verified"
          echo "result=Found route (${PASSED}p)" >> "$GITHUB_OUTPUT"

          # P1.8: ship the full verified responses as {regionId}-corridors.json —
          # array of {name, request, response}. Public map data only, no secrets.
          # `>= 1`, not `== 1`: the array now carries one entry per verified pair.
          # Checked 2026-08-05 — nothing in the Rods repo parses this file with a
          # length assumption, so widening it breaks no consumer.
          echo "$CORRIDORS" > "${REGION}-corridors.json"
          jq -e 'type == "array" and length >= 1 and (.[0].response.trip != null)' \
            "${REGION}-corridors.json" > /dev/null
          echo "Corridor asset written: ${REGION}-corridors.json ($(stat -c%s "${REGION}-corridors.json") bytes)"
          rm -f work/verify_extract.tar
          sudo rm -rf work/verify_tiles

      - name: Write region report + job summary
        run: |
          set -euo pipefail
          jq -n \
            --arg region "$REGION" \
            --argjson pbf_mb "${{ steps.pbf.outputs.pbf_mb }}" \
            --argjson tiles_seconds "${{ steps.tiles.outputs.tiles_seconds }}" \
            --argjson gz_bytes "${{ steps.pack.outputs.gz_bytes }}" \
            --argjson gz_mb "${{ steps.pack.outputs.gz_mb }}" \
            --arg sha256 "${{ steps.pack.outputs.sha256 }}" \
            --arg sha16 "${{ steps.pack.outputs.sha16 }}" \
            --arg sanity "${{ steps.sanity.outputs.result }}" \
            --argjson concurrency "${{ steps.tiles.outputs.concurrency }}" \
            --argjson retried "${{ steps.tiles.outputs.retried }}" \
            --argjson gph_count "${{ steps.pack.outputs.gph_count }}" \
            --arg image "$VALHALLA_REF" \
            '{region: $region, pbf_mb: $pbf_mb, tiles_seconds: $tiles_seconds,
              gz_bytes: $gz_bytes, gz_mb: $gz_mb, sha256: $sha256, sha16: $sha16,
              sanity: $sanity, concurrency: $concurrency, retried: $retried,
              gph_count: $gph_count, image: $image}' \
            > "valhalla-report-${REGION}.json"
          cat "valhalla-report-${REGION}.json"
          {
            echo "### ${REGION}"
            echo ""
            echo "| PBF (MB) | Tiles wall-time (s) | Pack (MB) | sha256[0:16] | Sanity route | Concurrency | Retried |"
            echo "|---:|---:|---:|---|---|---|---|"
            echo "| ${{ steps.pbf.outputs.pbf_mb }} | ${{ steps.tiles.outputs.tiles_seconds }} | ${{ steps.pack.outputs.gz_mb }} | \`${{ steps.pack.outputs.sha16 }}\` | ${{ steps.sanity.outputs.result }} | c${{ steps.tiles.outputs.concurrency }} | ${{ steps.tiles.outputs.retried }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── L3 of the upload accuracy chain ───────────────────────────────────
      # Upload THIS region's assets now, from the job that built and verified
      # them, and then prove the bytes GitHub is serving are the bytes we sent.
      #
      # The HEAD check is the link nothing else covers: the sanity gate proves
      # the local file routes, and verify-release later proves the SERVED file
      # matches the manifest — but between them sits an upload that can truncate.
      # Catching it here names the region while its logs are still in front of
      # you, instead of surfacing as a mystery checksum failure hours later.
      #
      # .sha256 sidecars are BUILT but NOT PUBLISHED. They are still produced and
      # still read inside this job (the `sha256=` output that becomes
      # valhallaChecksum comes from cutting the file), so checksum provenance is
      # unchanged — they simply stop being release assets. A release caps at 1000
      # assets; at 234 regions the sidecars would be 234 of them buying nothing,
      # since the manifest is the checksum source of truth and the app verifies
      # against valhallaChecksum from the manifest, never a sidecar.
      - name: Upload this region to the release + verify the upload
        if: inputs.upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.tag_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            "${REGION}-valhalla.tar.gz" \
            "${REGION}-corridors.json" \
            --clobber
          echo "Uploaded ${REGION} to $TAG"

          EXPECTED="${{ steps.pack.outputs.gz_bytes }}"
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${REGION}-valhalla.tar.gz"
          # Retry: a just-uploaded asset can 404 briefly while the CDN catches up,
          # which is not the same thing as a bad upload and must not fail the region.
          SERVED=""
          for attempt in 1 2 3 4 5; do
            # Last Content-Length wins: the request follows redirects to the CDN,
            # so several header blocks come back and only the final one is the asset.
            SERVED=$(curl -sSLI --fail "$URL" 2>/dev/null | tr -d '\r' | awk 'tolower($1)=="content-length:"{v=$2} END{print v}' || echo "")
            [ -n "$SERVED" ] && break
            echo "HEAD not ready yet (attempt $attempt) — waiting"
            sleep 10
          done
          if [ -z "$SERVED" ]; then
            echo "::error::[$REGION] uploaded asset is not reachable at $URL — refusing to report success"
            exit 1
          fi
          if [ "$SERVED" != "$EXPECTED" ]; then
            echo "::error::[$REGION] TRUNCATED UPLOAD — served $SERVED B, built $EXPECTED B. Asset must be re-uploaded."
            exit 1
          fi
          echo "Upload verified: served Content-Length $SERVED B == built $EXPECTED B"

      # Only the report JSON travels as an artifact — a few hundred bytes per
      # region. The tar deliberately does NOT: shipping 45 GB through the artifact
      # store just to hand it to a publish job is what made the old shape
      # undeployable at 234 regions.
      - name: Upload region report
        uses: actions/upload-artifact@v4
        with:
          name: valhalla-report-${{ matrix.region }}
          path: valhalla-report-${{ matrix.region }}.json
          retention-days: 1

  # Job 3: Collect packs, publish the smoke PRERELEASE, print the size table.
  # Runs only when every region built AND verified — a partial smoke release has
  # no value and could mislead consumers.
  # Job 3: write the release's manifest from the per-region reports, and say
  # plainly which regions are missing.
  #
  # `!cancelled()` and NOT `needs.build.result == 'success'`: with 234 regions a
  # run where every single one succeeds is not the common case, and the old gate
  # meant one archipelago with an unroutable sanity pair discarded a ~20-hour
  # build. Regions that succeeded have already uploaded themselves; this job's
  # duty is to describe what is actually there, failures included.
  finalize:
    needs: [get-regions, prepare-release, build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ !cancelled() && inputs.upload }}
    steps:
      - uses: actions/checkout@v4

      - name: Download region reports
        uses: actions/download-artifact@v4
        with:
          pattern: valhalla-report-*
          path: all-reports
          merge-multiple: true

      - name: Stage reports + name the regions that did not report
        run: |
          set -euo pipefail
          mkdir -p reports release-files
          mv all-reports/valhalla-report-*.json reports/ 2>/dev/null || true
          REPORTED=$(ls reports/ 2>/dev/null | wc -l | tr -d ' ')
          echo "regions reporting: $REPORTED"
          if [ "$REPORTED" -eq 0 ]; then
            echo "::error::No region produced a report — nothing to publish."
            exit 1
          fi
          # A region in the dispatch that produced no report FAILED. Listing them
          # by name is the difference between "re-run the 234" and "re-run these
          # three", which at ~16 h of build time is the entire cost of a retry.
          echo '${{ needs.get-regions.outputs.matrix }}' | jq -r '.[]' | sort > /tmp/requested.txt
          ls reports/ | sed 's/^valhalla-report-//; s/\.json$//' | sort > /tmp/reported.txt
          comm -23 /tmp/requested.txt /tmp/reported.txt > /tmp/failed.txt || true
          if [ -s /tmp/failed.txt ]; then
            {
              echo "### ⚠ Regions that FAILED and are NOT in this release"
              echo ""
              sed 's/^/- /' /tmp/failed.txt
              echo ""
              echo "Re-dispatch with \`regions\` set to just these ids; the upload uses --clobber, so a rebuild replaces in place."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::$(wc -l < /tmp/failed.txt | tr -d ' ') region(s) failed: $(tr '\n' ' ' < /tmp/failed.txt)"
          fi

      - name: Build the release manifest + summary table
        id: info
        env:
          # Needed by the accumulate step below — it reads the release's existing
          # manifest.json so a later batch adds to it instead of replacing it.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Tag and dataVersion come from prepare-release, which resolved them ONCE
          # before any region built. They are not re-derived here: the build jobs
          # uploaded against that exact tag, so a second derivation would be a
          # second source of truth for the one value that 404s every download if it
          # drifts. (The rules — smoke takes today's date, production takes the date
          # out of the tag — are documented in full at prepare-release.)
          TAG="${{ needs.prepare-release.outputs.tag_name }}"
          VERSION="${{ needs.prepare-release.outputs.version }}"
          CHANNEL="${{ needs.prepare-release.outputs.channel }}"
          if [ -z "$TAG" ] || [ -z "$VERSION" ]; then
            echo "::error::prepare-release produced no tag/version — refusing to publish a manifest that cannot be addressed"
            exit 1
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
          echo "Channel: $CHANNEL   Tag: $TAG   dataVersion: $VERSION"
          # P1.6 contract manifest: regions carry valhallaSize (bytes of the
          # .tar.gz) + valhallaChecksum (sha256 FIRST 16 HEX — exactly how
          # computeChecksum() truncates in scripts/generate-manifest.ts). Shipped
          # as manifest.json on this PRERELEASE only (never becomes releases/latest)
          # plus a legacy valhalla-manifest.json copy for earlier app-side tests.
          jq -s --arg version "$VERSION" --arg gen "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            '{version: $version, generatedAt: $gen,
              regions: (map({(.region): {valhallaSize: .gz_bytes, valhallaChecksum: .sha16}}) | add)}' \
            reports/*.json > work-manifest.json

          # ── ACCUMULATE, NEVER REPLACE ──────────────────────────────────────
          #
          # This manifest describes ONLY the regions in THIS dispatch, and it is
          # uploaded with --clobber. The rollout is explicitly batched against one
          # tag, and the failure summary tells the operator to re-dispatch just the
          # failed ids — so writing it straight out means batch 3 deletes batches
          # 1 and 2 from the manifest while their tars sit on the release, unread.
          # The merge workflow reads THIS file to decide which regions get
          # valhallaSize in production, so those regions would silently never be
          # downloadable: 45 GB built, paid for, and invisible.
          #
          # So: fetch what the release already published and fold this run into it.
          # A version disagreement means someone is mixing dataVersions under one
          # tag, which is the 404 class — refuse rather than merge.
          if gh release download "$TAG" -D prev --pattern 'manifest.json' 2>/dev/null; then
            PREV_VERSION=$(jq -r '.version // empty' prev/manifest.json)
            if [ -n "$PREV_VERSION" ] && [ "$PREV_VERSION" != "$VERSION" ]; then
              echo "::error::$TAG already carries dataVersion $PREV_VERSION but this run is $VERSION — refusing to mix versions under one tag"
              exit 1
            fi
            # PARENTHESES ARE LOAD-BEARING. Without them jq parses this as
            # `.[0].regions * (.[1].regions as $merged | ...)` — `as` binds looser
            # than `*` and swallows the rest of the pipeline — and the output keeps
            # ONLY this run's regions, reintroducing the exact erasure this step
            # exists to prevent. Caught by running it, not by reading it.
            # `*` is a recursive merge with the RIGHT side winning, so a rebuilt
            # region correctly replaces its earlier entry.
            jq -s '(.[0].regions * .[1].regions) as $merged
                   | .[1] | .regions = $merged' \
              prev/manifest.json work-manifest.json > release-files/manifest.json
            echo "Accumulated: $(jq '.regions | length' prev/manifest.json) already published + $(jq '.regions | length' work-manifest.json) from this run = $(jq '.regions | length' release-files/manifest.json) total"
          else
            cp work-manifest.json release-files/manifest.json
            echo "First batch on $TAG: $(jq '.regions | length' release-files/manifest.json) regions"
          fi
          cp release-files/manifest.json release-files/valhalla-manifest.json
          jq '.regions | keys | length as $n | "\($n) regions in the release manifest"' release-files/manifest.json
          {
            echo "## Valhalla smoke packs — dataVersion $VERSION"
            echo ""
            echo "| Region | PBF (MB) | Tiles wall-time (s) | Pack (MB) | sha256[0:16] | Sanity route | Concurrency | Retried |"
            echo "|---|---:|---:|---:|---|---|---|---|"
            jq -r '"| \(.region) | \(.pbf_mb) | \(.tiles_seconds) | \(.gz_mb) | `\(.sha16)` | \(.sanity) | c\(.concurrency) | \(.retried) |"' reports/*.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the manifests + finalize the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.info.outputs.tag_name }}"

          # NO `gh release delete` here. It used to run first, so a second batch
          # against the same tag destroyed the previous batch's assets — which is
          # exactly how a 234-region rollout is done (in batches, appending). The
          # release already exists: prepare-release made it before any region built,
          # and every build job has been uploading its own tar into it since.
          #
          # PRERELEASE is load-bearing: the app + verify-manifest.yml resolve
          # releases/latest/download/... — a normal release here would hijack
          # "latest" and 404 every manifest.json fetch (this release DOES carry a
          # manifest.json asset, which is safe only because a prerelease can never
          # become releases/latest).
          # --prerelease on BOTH channels, production included. This is not a
          # leftover from the smoke days: the production manifest.json lives on the
          # monthly osm-* release and clients resolve it through
          # releases/latest/download/manifest.json. This release also carries a
          # manifest.json asset, so the moment it stopped being a prerelease it
          # would become `latest` and every client would fetch THIS manifest —
          # which lists only valhalla fields — instead of the real one. Nothing
          # here needs `latest`: the pack URL is version-pinned by tag.
          CHANNEL="${{ steps.info.outputs.channel }}"
          if [ "$CHANNEL" = production ]; then
            TITLE="Valhalla Routing Packs - ${{ steps.info.outputs.version }}"
            LEAD="PRODUCTION Valhalla routing packs (FEAT-033). Consumed by the app: the pack URL is built as releases/download/$TAG/{region}-valhalla.tar.gz, pinned to the manifest version, so this tag MUST match the monthly manifest's version."
          else
            TITLE="Valhalla Routing Packs (smoke) - ${{ steps.info.outputs.version }}"
            LEAD="SMOKE-TEST Valhalla routing packs (FEAT-033 P1.6 app contract). Not consumed by any production client."
          fi
          # EDIT, not create: the release exists already. Writing the notes here
          # rather than at creation means they describe what actually landed —
          # a run where 6 regions failed says so, instead of promising 234.
          gh release edit "$TAG" \
            --prerelease \
            --title "$TITLE" \
            --notes "$LEAD

          **dataVersion:** ${{ steps.info.outputs.version }}

          **Contents (per region):**
          - {region-id}-valhalla.tar.gz - gzip of the SINGLE valhalla_build_extract tar (index.bin + graph tiles) that mjolnir.tile_extract memory-maps; GRAPH-ONLY (no tz/admin sqlite)
          - (no .sha256 sidecars: the manifest's valhallaChecksum is the checksum of record, and 233 sidecars would burn a quarter of GitHub's 1000-asset cap for nothing)
          - {region-id}-corridors.json - P1.8 corridor fixtures: array of {name, request, response} with the FULL valhalla route response from CI verification
          - manifest.json - regions carry valhallaSize + valhallaChecksum (sha256 first 16 hex, same truncation as generate-manifest.ts computeChecksum)
          - valhalla-manifest.json - legacy copy of manifest.json (pre-P1.6 name)

          **Verification already performed in CI (per region, all from ONE digest-pinned valhalla image):**
          - extract structure: index.bin present + .gph tiles in the tar
          - size band vs 0.39 x PBF estimate
          - one-shot valhalla_service in TILE_EXTRACT mode against the tar gunzipped from this exact asset -> \"Found route\"

          This tag is a PRERELEASE on purpose - it must never become releases/latest (the production manifest.json lives on the monthly osm-* releases)."

          # Only the manifests: every tar and corridors.json was uploaded by the
          # build job that produced it, right after its sanity gate.
          cd release-files
          gh release upload "$TAG" manifest.json valhalla-manifest.json --clobber
          echo "Manifests uploaded to $TAG."

      - name: Delete older smoke prereleases
        if: inputs.prune_old_smoke
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Keep only the current valhalla-smoke-* release so stale smoke tags never
          # pile up (the monthly cleanup counts ALL releases toward keep_latest:3).
          # Opt-out via the prune_old_smoke input when an older smoke release must
          # survive (e.g. a still-referenced contract-verification tag).
          # CUR comes from the EFFECTIVE tag (which may be an override, not
          # run_number) and only numerically LOWER tags are deleted — never a newer
          # run's release, never the current one, never non-numeric tags.
          CUR_TAG="${{ steps.info.outputs.tag_name }}"
          CUR="${CUR_TAG#valhalla-smoke-}"
          if ! [[ "$CUR" =~ ^[0-9]+$ ]]; then
            echo "Current tag $CUR_TAG has a non-numeric suffix — skipping prune"
            exit 0
          fi
          gh release list --limit 100 --json tagName -q '.[].tagName' \
            | { grep '^valhalla-smoke-' || true; } \
            | while read -r t; do
                n="${t#valhalla-smoke-}"
                if [[ "$n" =~ ^[0-9]+$ ]] && [ "$n" -lt "$CUR" ]; then
                  echo "Deleting old smoke release $t"
                  gh release delete "$t" --yes --cleanup-tag || true
                fi
              done

      - name: Release summary
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Release: [${{ steps.info.outputs.tag_name }}](../../releases/tag/${{ steps.info.outputs.tag_name }}) (prerelease)" >> "$GITHUB_STEP_SUMMARY"
