    "asia-china-guizhou":"26.647,106.630|27.725,106.927",
    "asia-kazakhstan":"43.238,76.945|51.169,71.449",
    "asia-jordan":"31.953,35.910|29.532,35.006",
    "asia-malaysia-singapore-brunei":"3.139,101.687|1.492,103.741",
    "asia-saudi-arabia":"24.713,46.675|26.420,50.088",
    "central-america-guatemala":"14.634,-90.507|14.845,-91.518",
    "central-america-haiti-and-domrep":"18.486,-69.931|19.451,-70.697",
    "central-america-honduras":"14.072,-87.192|15.505,-88.025",
    "central-america-panama":"8.983,-79.520|8.427,-82.431",
    "central-america-nicaragua":"12.114,-86.236|12.435,-86.878",
    "europe-france-guadeloupe":"16.241,-61.533|15.998,-61.726",
    "europe-france-guyane":"4.922,-52.313|5.160,-52.650",
    "europe-germany-baden-wuerttemberg":"48.776,9.183|49.007,8.404",
    "europe-germany-berlin":"52.520,13.405|52.536,13.200",
